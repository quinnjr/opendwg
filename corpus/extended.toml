# Extended public corpus: real-world drawings from many producers (AutoCAD, Civil 3D, BricsCAD,
# ODA/Teigha, SolidWorks, acadrust, civilcraft's own writer), and negative cases. The files are NOT
# in the repository: scripts/fetch-corpus.sh downloads them into corpus/files/<name>.dwg and checks
# their sha256. Keep one `key = "value"` or `key = [..]` per line: the script parses this with awk.
# Same per-file schema as manifest.toml, plus `producer` (the writer, from the file's AppInfo or
# its source). `expect` is optional:
# - `expect.open = "unsupported"`: not a version the crate reads (pre-R2000, or not a DWG); opening
#   must fail with Error::UnsupportedVersion. `version` is then the file's first 6 bytes as found.
# - `expect.unconvertible = true`: the file holds objects R2018 cannot store, so a save must fail
#   with Error::UnconvertibleObjects.
# Feature tags were computed with the library from the decoded drawings (see corpus/README.md).
# Research ids (camber-01, cc-12, ...) are kept as names so findings and commits can cite them.

