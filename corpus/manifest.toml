# Public sample corpus. The files are NOT in the repository: run scripts/fetch-corpus.sh.
# Each [[file]] is downloaded to corpus/files/<name>.dwg and checked against sha256.
# Keep one `key = "value"` or `key = [..]` per line: scripts/fetch-corpus.sh parses this file with awk.
# Feature tags for the ACadSharp sample_AC10xx files were taken from the sibling *_ascii.dxf files in
# the same ACadSharp commit (entity types present).
# `expect.object_count`: objects listed in the object map, as decoded by `Drawing::from_bytes`
# (`dwgdump --objects`). Cross-checked for acadsharp-sample-ac1032 against the handles (group
# codes 5 and DIMSTYLE 105) of the sibling sample_AC1032_ascii.dxf at the same commit: 847 there,
# minus 13 objects of one anonymous table block that the DXF export renumbered, minus a
# CELLSTYLEMAP and four SORTENTSTABLE objects that only the export has, plus the 13 originals.
# Table counts (`expect.table_control_count`, `expect.<type>_count` for BLOCK_HEADER, LAYER, STYLE,
# LTYPE, VIEW, UCS, VPORT, APPID, DIMSTYLE, VP_ENT_HDR): the TABLE and entry counts of the TABLES
# section of each sibling *_ascii.dxf (and BLOCKLOOKUPPARAMETER.dxf) at the same commit, with three
# known differences: the AC1015-AC1024 DWGs have one more APPID (ACAD_SPLINE_DATA, which the exports
# omit); the AC1015 DWG has a VP_ENT_HDR_CONTROL and 3 VP_ENT_HDR, which DXF has no table for (counted
# from the DWG); AecObjects.dwg has no DXF sibling, so its counts are the decoded ones.
# Entity counts (`expect.<type>_count` for LINE, POINT, CIRCLE, ARC, ELLIPSE, RAY, XLINE, SOLID, TRACE,
# 3DFACE as face3d, SHAPE, BLOCK, ENDBLK, SEQEND, INSERT, MINSERT, TEXT, ATTRIB, ATTDEF, MTEXT): the
# entities of that type (group 0) in the ENTITIES and BLOCKS sections of each sibling DXF at the same
# commit; SEQEND counts those of polylines too. AecObjects.dwg: the decoded counts.
# Polyline and curve counts (`expect.<type>_count` for LWPOLYLINE, POLYLINE_2D/3D/PFACE/MESH,
# VERTEX_2D/3D/MESH/PFACE/PFACE_FACE, SPLINE, MLINE): the entities of that type in the ENTITIES and
# BLOCKS sections of each sibling DXF at the same commit. DXF has one POLYLINE and one VERTEX type, so
# they are told apart by group 70: POLYLINE 8 is 3D, 16 mesh, 64 polyface, otherwise 2D; VERTEX 32
# is 3D, 64 (without 128) mesh, 128 + 64 polyface location, 128 alone polyface face, otherwise 2D.
# AecObjects.dwg: the decoded counts.
# Dimension and annotation counts (`expect.<type>_count` for DIMENSION_ORDINATE/LINEAR/ALIGNED/ANG3PT/
# ANG2LN/RADIUS/DIAMETER, ARC_DIMENSION, LARGE_RADIAL_DIMENSION, LEADER, TOLERANCE, MULTILEADER): the
# entities of that type in the ENTITIES and BLOCKS sections of each sibling DXF at the same commit. DXF
# has one DIMENSION type, told apart by group 70 & 7: 0 linear (rotated), 1 aligned, 2 angular 2-line,
# 3 diameter, 4 radius, 5 angular 3-point, 6 ordinate. AecObjects.dwg: the decoded counts.
# Hatch, viewport, image and modeler counts (`expect.<type>_count` for HATCH, VIEWPORT, IMAGE, WIPEOUT,
# REGION, 3DSOLID as solid3d, BODY, OLE2FRAME, ACAD_PROXY_ENTITY as proxy_entity): the entities of that
# type in the ENTITIES and BLOCKS sections of each sibling DXF (and BLOCKLOOKUPPARAMETER.dxf) at the same
# commit. AecObjects.dwg: the decoded counts.
# Non-graphical object counts (`expect.<type>_count` for DICTIONARY, ACDBDICTIONARYWDFLT as
# dictionary_with_default, XRECORD, LAYOUT, PLOTSETTINGS, GROUP, MLINESTYLE, MLEADERSTYLE, TABLESTYLE,
# IMAGEDEF, IMAGEDEF_REACTOR, RASTERVARIABLES, WIPEOUTVARIABLES, SCALE, DICTIONARYVAR, ACDBPLACEHOLDER as
# placeholder, SORTENTSTABLE, ACAD_PROXY_OBJECT as proxy_object, SPATIAL_INDEX, LAYER_INDEX,
# SPATIAL_FILTER): the objects of that type (group 0) in the sibling DXF at the same commit (and
# BLOCKLOOKUPPARAMETER.dxf), except DICTIONARY and XRECORD where the older exports differ from their
# DWGs (DXF/DWG: AC1015 134/139 and 218/224, AC1018 124/126 and 200/210, AC1021 118/117 dictionaries,
# AC1024 115/117 and 136/140, BLOCKLOOKUPPARAMETER 34/33 xrecords); there the decoded counts are kept.
# AecObjects.dwg: the decoded counts.

